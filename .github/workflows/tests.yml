name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, json
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit --testdox-text phpunit-testdox.txt
      - name: The dependency-free runner agrees (smoke check of the fallback)
        if: matrix.php == '8.3'
        run: php tests/run.php
      - name: Failed tests
        if: failure()
        run: |
          echo '### Failed tests (PHP ${{ matrix.php }})' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^ ?(✘|[x])' phpunit-testdox.txt >> "$GITHUB_STEP_SUMMARY" || true

  browser:
    # the SPA client in Chromium, against the starter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the starter app
        working-directory: starter
        run: composer install --no-interaction --no-progress
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run the browser checks
        run: |
          rm -f starter/storage/database.sqlite
          mkdir -p starter/storage
          cp starter/.env.example starter/.env
          (cd starter && php cast migrate --seed)
          php -S 127.0.0.1:8099 -t starter/public starter/public/index.php > server.log 2>&1 &
          sleep 2
          BASE=http://127.0.0.1:8099 node tests/e2e/spa.e2e.js
      - name: Server log
        if: failure()
        run: cat server.log

  install:
    # the install path a user follows: composer require + cast init, then the app answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: framework
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, json
      - name: Require the package from this checkout
        run: |
          mkdir my-app && cd my-app
          composer init --name=ci/app --no-interaction
          composer config minimum-stability dev
          composer config repositories.cast path ../framework
          composer config allow-plugins.anode/cast-framework true
          composer require anode/cast-framework:@dev --no-interaction
          test -x cast          # the Composer plugin created the launcher
          php cast init --demo -n
          composer dump-autoload
      - name: The app answers
        working-directory: my-app
        run: |
          php -S 127.0.0.1:8123 -t public public/index.php > ../server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8123/ | grep -q "cast-view"
          curl -fsS -H 'X-Cast-Request: 1' http://127.0.0.1:8123/ | grep -q "Welcome"
          curl -fsS -X POST http://127.0.0.1:8123/api/auth/token -H 'Content-Type: application/json' -d '{"email":"admin@example.com","password":"password"}' | grep -q '"token"'
      - name: Server log
        if: failure()
        run: cat server.log

  databases:
    # the migrations and the query builder against real servers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [mysql, pgsql]
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cast_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: cast_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, mbstring, json
      - run: composer install --no-interaction --no-progress
      - name: Run the suite against ${{ matrix.db }}
        env:
          CAST_TEST_DB: ${{ matrix.db }}
          CAST_TEST_DB_HOST: 127.0.0.1
          CAST_TEST_DB_NAME: cast_test
          CAST_TEST_DB_USER: ${{ matrix.db == 'mysql' && 'root' || 'postgres' }}
          CAST_TEST_DB_PASS: root
        run: vendor/bin/phpunit --testdox-text phpunit-testdox.txt
      - name: Failed tests
        if: failure()
        run: |
          echo '### Failed tests (${{ matrix.db }})' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^ ?(✘|[x])' phpunit-testdox.txt >> "$GITHUB_STEP_SUMMARY" || true

  editor:
    # the VS Code extension: tokenisation against VS Code's own grammars, the navigation logic, and a .vsix build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node test/fetch-grammars.js
      - run: npm test
      - run: npx --yes @vscode/vsce package --no-dependencies -o cast-framework.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: cast-framework-vscode
          path: editor/vscode/cast-framework.vsix
